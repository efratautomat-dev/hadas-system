
[functions.test-api]
enabled = true
verify_jwt = true
import_map = "./functions/test-api/deno.json"
entrypoint = "./functions/test-api/index.ts"

[functions.hadas-api]
enabled = true
verify_jwt = false
import_map = "./functions/hadas-api/deno.json"
entrypoint = "./functions/hadas-api/index.ts"

[functions.payments-ingest]
enabled = true
verify_jwt = false
import_map = "./functions/payments-ingest/deno.json"
entrypoint = "./functions/payments-ingest/index.ts"

# verify_jwt = false so the cron trigger AND the in-app camera capture can call it
# with just x-hadas-key (no Supabase JWT), same as hadas-api / payments-ingest.
[functions.invoices-ingest]
enabled = true
verify_jwt = false
entrypoint = "./functions/invoices-ingest/index.ts"

# One-off reconciliation utility. verify_jwt = false so it's callable with just
# its own ?key= secret (no Supabase JWT), same pattern as the drive-probe helper.
[functions.drive-reconcile]
enabled = true
verify_jwt = false
entrypoint = "./functions/drive-reconcile/index.ts"

# The weekly database backup to Drive. verify_jwt = false so pg_cron can call it
# with just x-hadas-key, same as the two ingest jobs. There is deliberately NO
# JWT path inside the function: its only human caller is hadas-api, which checks
# the manager role before proxying.
[functions.backup-run]
enabled = true
verify_jwt = false
entrypoint = "./functions/backup-run/index.ts"
