<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>אין חיבור</title>
  <style>
    /* This page is what a tablet with no network sees, so it carries no font, no
       image and no request of its own. Capacitor also gives it NO access to
       plugins (its own constraint) — reloading is genuinely all it can offer. */
    :root {
      --ink: #0E1A2B; --ink-soft: #43536B; --ink-faint: #8494AB;
      --ground: #F6F8FC; --brand-lo: #3B82F6; --brand-hi: #1E40AF;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #E8EEF9; --ink-soft: #A3B1C6; --ink-faint: #6E7E96; --ground: #0A111C; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: var(--ground); color: var(--ink);
      font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    main { width: min(380px, 100%); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
    h1 { font-size: 17px; font-weight: 700; margin: 0; }
    p { font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin: 0; }
    .fine { font-size: 11.5px; color: var(--ink-faint); line-height: 1.55; }
    button {
      width: 100%; min-height: 48px; border: 0; border-radius: 12px; padding: 14px;
      background: linear-gradient(150deg, var(--brand-lo), var(--brand-hi)); color: #fff;
      font-family: inherit; font-size: 15px; font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true">
      <circle cx="29" cy="29" r="26" fill="#E9EEF6"/>
      <path d="M18 34.5a6.5 6.5 0 0 1 1.6-12.8 9.5 9.5 0 0 1 17.6-2.4 7.5 7.5 0 0 1 2.6 14.6"
            fill="none" stroke="#8494AB" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M17 15l25 27" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>אין חיבור לאינטרנט</h1>
    <p>המערכת עובדת אונליין בלבד.<br>בדקי את החיבור של הטאבלט ונסי שוב.</p>
    <button onclick="window.location.reload()">נסי שוב</button>
    <p class="fine">שום נתון לא נשמר במכשיר, ולכן אין מה לאבד — ברגע שהחיבור חוזר הכול חוזר.</p>
  </main>
</body>
</html>
